[project]
name = "claude_api"
version = "0.1.0"
description = "An agent implemented with the Claude API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
claude_api = "claude_api:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
