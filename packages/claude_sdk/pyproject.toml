[project]
name = "claude_sdk"
version = "0.1.0"
description = "An agent implemented with the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.136",
]

[project.scripts]
claude_sdk = "claude_sdk:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
