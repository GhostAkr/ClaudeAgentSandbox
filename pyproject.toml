[project]
name = "anthropiccertification"
version = "0.1.0"
description = "A sandbox for experiments with Claude agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
anthropiccertification = "anthropiccertification:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
