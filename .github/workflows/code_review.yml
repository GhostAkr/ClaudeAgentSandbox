# .github/workflows/code_review.yml

name: code_review

on:
  pull_request:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            "Review this PR for code smell."
          claude_args: |
            --output-format json \
            --allowed-tools "Read Grep Glob" \
